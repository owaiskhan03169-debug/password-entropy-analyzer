<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Entropy Analysis Tool</title>
    <style>
        /* Terminal Aesthetics */
        body {
            background-color: #0a0a0a;
            color: #00ff00; /* Classic Terminal Green */
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        #terminal-container {
            width: 100%;
            max-width: 800px;
            background: #111;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.1);
            border: 1px solid #333;
        }

        /* Color Classes for ANSI simulation */
        .cyan { color: #00ffff; }
        .yellow { color: #ffff00; }
        .red { color: #ff3333; }
        .green { color: #33ff33; }
        .bold { font-weight: bold; }

        pre { margin: 0; font-family: inherit; }
        
        #output-area {
            white-space: pre-wrap;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        /* Input Line Styling */
        .input-group {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }

        .prompt-text {
            margin-right: 10px;
        }

        input[type="text"] {
            background: transparent;
            border: none;
            color: #ffff00;
            font-family: inherit;
            font-size: 16px;
            outline: none;
            flex-grow: 1;
            caret-color: #00ff00;
        }
    </style>
</head>
<body>

    <div id="terminal-container">
        <div class="cyan bold">
 <pre>
 ___________________________________________ 
|               Owais Khan v.01             |
|       System Entropy Analysis Tool        |
|___________________________________________|
 </pre>
        </div>
        <br>
        <div id="output-area"></div>
        <div class="input-group">
            <span class="green bold prompt-text">owais@OwaisOS:~$</span>
            <span class="yellow prompt-text">[LOG] Enter target password to scan:</span>
            <input type="text" id="password-input" autofocus autocomplete="off">
        </div>
    </div>

    <script>
        const inputField = document.getElementById('password-input');
        const outputArea = document.getElementById('output-area');

        // Helper function to simulate terminal typing delay
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        // Function to print text with a typewriter effect
        async function typeWriter(text, useHTML = false, delay = 15) {
            const lineDiv = document.createElement('div');
            outputArea.appendChild(lineDiv);

            if (useHTML) {
                lineDiv.innerHTML = text; // Fast print for formatted blocks
                await sleep(delay * 10);
            } else {
                for (let i = 0; i < text.length; i++) {
                    lineDiv.innerHTML += text.charAt(i);
                    await sleep(delay);
                }
            }
            // Auto-scroll to bottom
            window.scrollTo(0, document.body.scrollHeight);
        }

        function analyzePassword(password) {
            let poolSize = 0;
            const length = password.length;

            const hasUpper = /[A-Z]/.test(password);
            const hasLower = /[a-z]/.test(password);
            const hasDigit = /[0-9]/.test(password);
            const hasSymbol = /[^A-Za-z0-9]/.test(password);

            if (hasLower) poolSize += 26;
            if (hasUpper) poolSize += 26;
            if (hasDigit) poolSize += 10;
            if (hasSymbol) poolSize += 32;

            if (poolSize === 0) return { entropy: 0, crackTime: 0, checks: [false, false, false, false] };

            const entropy = length * Math.log2(poolSize);
            const combinations = Math.pow(poolSize, length);
            
            // Assume 100 Billion hashes/sec for attacker hardware
            const hashesPerSec = 100_000_000_000;
            const secondsToCrack = combinations / hashesPerSec;

            return { entropy, crackTime: secondsToCrack, checks: [hasUpper, hasLower, hasDigit, hasSymbol] };
        }

        function formatTime(seconds) {
            if (seconds < 1) return "Less than a second";
            
            const intervals = [
                { name: 'centuries', seconds: 3153600000 },
                { name: 'years', seconds: 31536000 },
                { name: 'days', seconds: 86400 },
                { name: 'hours', seconds: 3600 },
                { name: 'minutes', seconds: 60 },
                { name: 'seconds', seconds: 1 }
            ];

            for (let i = 0; i < intervals.length; i++) {
                const val = Math.floor(seconds / intervals[i].seconds);
                if (val > 0) return `${val} ${intervals[i].name}`;
            }
            return "Instant";
        }

        // Main event listener for user input
        inputField.addEventListener('keypress', async function(e) {
            if (e.key === 'Enter') {
                const password = this.value;
                if (!password) return;

                // Disable input during scanning
                this.value = '';
                this.disabled = true;
                outputArea.innerHTML = ''; // Clear previous scan

                await typeWriter(`<span class="yellow">[LOG] Target acquired. Length: ${password.length} characters</span>`, true);
                await typeWriter(`<span class="cyan">[...] Initializing Cryptographic Analysis...</span>`, true);
                await sleep(800);

                const data = analyzePassword(password);
                const u = data.checks[0], l = data.checks[1], d = data.checks[2], s = data.checks[3];

                // Print Diagnostics
                await typeWriter(`<span class="${u ? 'green' : 'red'}">[${u ? '✓' : '✗'}] Uppercase letters</span>`, true);
                await typeWriter(`<span class="${l ? 'green' : 'red'}">[${l ? '✓' : '✗'}] Lowercase letters</span>`, true);
                await typeWriter(`<span class="${d ? 'green' : 'red'}">[${d ? '✓' : '✗'}] Numeric digits</span>`, true);
                await typeWriter(`<span class="${s ? 'green' : 'red'}">[${s ? '✓' : '✗'}] Special symbols</span>`, true);
                await sleep(500);

                // Determine Security Class
                let strengthClass = `<span class="red">VULNERABLE</span>`;
                if (data.entropy >= 60) strengthClass = `<span class="green">UNBREAKABLE</span>`;
                else if (data.entropy >= 40) strengthClass = `<span class="yellow">MODERATE</span>`;

                // Print Results
                const resultsHTML = `
<br><span class="bold">ANALYSIS RESULTS:</span>
---------------------------
Entropy Score: <span class="cyan">${data.entropy.toFixed(2)} bits</span>
Security Class: ${strengthClass}
Estimated Crack Time: <span class="bold">${formatTime(data.crackTime)}</span>
---------------------------<br>`;
                
                await typeWriter(resultsHTML, true);

                if (data.entropy < 50) {
                    await typeWriter(`<span class="yellow">[ADVICE] Add symbols or increase length to prevent brute-force attacks.</span>`, true);
                } else {
                    await typeWriter(`<span class="green">[SUCCESS] Password meets high-security encryption standards.</span>`, true);
                }

                await typeWriter("<br>", true);

                // Re-enable input
                this.disabled = false;
                this.focus();
            }
        });
    </script>
</body>
</html>
